name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # `npm run build` is `tsc && vite build`, so this type-checks and
      # bundles in one step — a separate `tsc` step would be redundant.
      - run: npm run build
      - run: npm run test

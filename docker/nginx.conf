# Static server for the built game. Mounted over the base image's default site
# at /etc/nginx/conf.d/default.conf.
#
# TLS, HTTP->HTTPS and the security-header set are the reverse proxy's job
# wherever this is deployed; this file is only concerned with what a static
# server has to get right on its own — cache lifetimes that match how each kind
# of file is named, and a cheap endpoint for the healthcheck.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # The bundle and stylesheet compress well; the guide audio does not usefully
    # (PCM WAV under gzip pays real CPU for a few percent) and is deliberately
    # left out. nginx compresses text/html unconditionally, so naming it here
    # would only produce a duplicate-MIME-type warning.
    #
    # Both JavaScript media types are listed on purpose: nginx changed the
    # default type for .js from application/javascript to text/javascript in
    # 1.21.1, and naming only one of them silently stops compressing the bundle
    # on an image that disagrees with this file about which era it is in.
    gzip on;
    gzip_types text/javascript application/javascript text/css image/svg+xml application/json;
    gzip_min_length 1024;

    # Cheap fixed response for the container healthcheck — see the Dockerfile's
    # HEALTHCHECK. Never routed to by the game itself.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints everything it emits into /assets, so a given URL's bytes
    # can never change: a new build produces new filenames referenced by a new
    # index.html. That is exactly what `immutable` is for.
    #
    # nginx does not inherit add_header into a location that sets any of its own,
    # so the nosniff header from the server level is repeated in each block below
    # rather than inherited. Dropping a repeat silently un-sets it.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # public/ is copied to the site root verbatim, so the guide clips and icons
    # keep stable names across builds and cannot be immutable. A day is long
    # enough to keep a run from re-fetching 4.6 MB of audio and short enough
    # that regenerated voices land without a hard refresh.
    #
    # nginx's bundled mime.types has no entry for .wav, so without the
    # default_type below every clip goes out as application/octet-stream —
    # which Web Audio ignores but an HTML5 `<audio>` element (Phaser's fallback
    # path when Web Audio is unavailable) can refuse to play, and which is a bad
    # pairing with the nosniff header this file sets. `default_type` is used
    # rather than a `types { audio/wav wav; }` block on purpose: a nested
    # `types` block *replaces* the inherited map rather than adding to it, which
    # would silently turn the bundle and stylesheet into octet-streams too.
    location /audio/ {
        default_type audio/wav;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ ^/(icons|favicon)\.svg$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The one file that must never be cached: it is what points at the current
    # build's fingerprinted assets, so a stale copy pins a browser to a
    # deployment that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # =404 rather than an index.html fallback. The game is a single document
    # with no client-side router, so nothing legitimately requests a path that
    # is not a file; falling back would answer a mistyped asset URL with 200 and
    # a page of HTML, which surfaces as a confusing parse error instead of the
    # 404 that says what actually happened.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
}
